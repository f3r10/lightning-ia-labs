<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  .ticket { border: 1px solid #333; border-radius: 6px; padding: .6rem 1rem; margin: .6rem 0; }
  .new { background: #fff6c2; }
  small { color: #555; }
</style>
</head>
<body>
<h1>Kitchen</h1>
<p>Paid orders appear here by themselves, even if the customer closed the page.</p>
<div id="tickets"><p>No paid orders yet.</p></div>
<script>
const seen = new Set();
async function load() {
  const res = await fetch("/api/kitchen/orders");
  if (!res.ok) return;
  const orders = await res.json();
  if (orders.length === 0) return;
  const box = document.getElementById("tickets");
  box.replaceChildren();
  for (const order of orders) {
    const div = document.createElement("div");
    div.className = "ticket" + (seen.has(order.id) ? "" : " new");
    seen.add(order.id);
    const items = document.createElement("strong");
    items.textContent = order.lines.map((l) => `${l.quantity} x ${l.name}`).join(", ");
    const info = document.createElement("small");
    info.textContent = ` paid ${new Date(order.paidAt).toLocaleTimeString()}, ${order.amountSats} sats` + (order.tipSats ? ` (tip ${order.tipSats})` : "");
    div.append(items, info);
    box.append(div);
  }
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
